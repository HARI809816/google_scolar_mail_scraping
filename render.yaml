services:
  - type: web
    name: scholar-scraper-api
    env: python
    plan: free

    buildCommand: |
      apt-get update
      apt-get install -y \
        chromium \
        chromium-driver \
        libnss3 \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libcups2 \
        libxss1 \
        libasound2 \
        libgbm1 \
        libxshmfence1
      pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
